<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Визитка</title>
<style>
@page{size:96.4mm 56.2mm;margin:0}
*{box-sizing:border-box;margin:0}
html,body{width:96.4mm;background:#fbf5ea;font-family:Inter,'Liberation Sans',sans-serif}
/* 90x50 мм + вылеты 3 мм; логотип 88 мм шириной (1 px = 0.08 мм) */
.card{width:96.4mm;height:56.2mm;position:relative;overflow:hidden;background:#fbf5ea}
.card img{position:absolute;left:4.2mm;top:5.8mm;width:88mm;display:block}
.t{position:absolute;left:50.6mm;white-space:nowrap}
.tag{top:6.2mm;font-weight:800;font-size:4.3mm;line-height:1.18;color:#0f3b4c}
.tag b{color:#ff7a3d;font-weight:800}
.phone{top:41.6mm;font-weight:800;font-size:3.75mm;color:#ff7a3d}
.site{top:46.4mm;font-weight:700;font-size:3.6mm;color:#2eb5b8}
</style></head><body>
<section class="card">
  <img src="logo.png" alt="Хочу на отдых">
  <div class="t tag">Пусть <b>папа</b> и <b>мама</b><br>знают</div>
  <div class="t phone">+7 (965) 2000-701</div>
  <div class="t site">хочунаотдых.рф</div>
</section>
</body></html>
